<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>园艺学院 · 院运会计分台</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/styles.css"><script src="/lucide.js" defer></script><script type="module" src="/app.js"></script></head>
<body>
 <section id="login" class="login" hidden><img src="/icon.svg" width="48" height="48" alt=""><h1>院运会计分台</h1><p>园艺学院 · 匿名演示</p><form id="login-form"><label>访问口令<input id="access-key" required autocomplete="off" type="password"></label><button type="submit" class="primary">进入计分台</button></form><p id="login-error" class="error"></p></section>
 <div id="desk" hidden>
  <header><div class="brand"><img src="/icon.svg" width="34" height="34" alt=""><div><strong>院运会计分台</strong><small>园艺学院 / 匿名演示</small></div></div><div class="head-actions"><span id="connection" class="connection">连接中</span><span id="role" class="role"></span><button id="share" class="icon" title="共享链接" aria-label="共享链接"><i data-lucide="share-2"></i></button><button id="export" class="icon" title="导出成绩表" aria-label="导出成绩表"><i data-lucide="download"></i></button><button id="backup" class="icon editor-only" title="备份数据" aria-label="备份数据"><i data-lucide="database-backup"></i></button></div></header>
  <div class="controlbar"><div class="segments" id="group"><button data-value="丙组" class="active">丙组 · 分组A</button><button data-value="丁组">丁组 · 分组B</button></div><nav id="tabs"><button class="active" data-view="entry">成绩录入</button><button data-view="ranking">项目排名</button><button data-view="teams">团体榜</button><button data-view="people">个人积分</button><button data-view="awards">自动评奖</button></nav><label class="operator editor-only">记录员<input id="operator" placeholder="记录员代号" maxlength="30"></label></div>
  <main><aside id="sidebar"><div class="segments sex" id="sex"><button data-value="男子" class="active">男子</button><button data-value="女子">女子</button></div><div id="events"></div><div class="side-bottom"><span id="team-count"></span><span id="athlete-count"></span></div></aside><section class="workspace"><div id="workspace"></div></section></main>
  <footer><span id="updated">尚无成绩</span><span>匿名演示 园艺学院学生田径运动会</span></footer>
 </div>
 <dialog id="edit-dialog"><form id="edit-form"><div class="dialog-head"><h2 id="edit-name"></h2><button type="button" data-close class="icon" aria-label="关闭"><i data-lucide="x"></i></button></div><p id="edit-team" class="muted"></p><label>成绩状态<select id="edit-status"><option value="valid">有效成绩</option><option value="dns">未参赛 DNS</option><option value="dnf">未完成 DNF</option><option value="dq">犯规取消成绩 DQ</option><option value="pending">待录入</option></select></label><label id="value-label">成绩<input id="edit-value" inputmode="decimal" autocomplete="off"></label><label id="rank-label">裁判确认名次（可留空）<input id="edit-rank" type="number" min="1" step="1" inputmode="numeric"></label><label id="record-label" class="check-label"><input id="edit-record" type="checkbox">裁判确认破校纪录（本项目加2分，仅加一次）</label><p class="muted rank-hint">同成绩可填写相同正式名次，取所占名次平均分；如1、2、2、4。</p><p id="edit-error" class="error" role="alert"></p><div class="dialog-actions"><button type="button" data-close>取消</button><button class="primary" id="save-result" type="submit"><i data-lucide="check"></i>保存成绩</button></div></form></dialog>
 <dialog id="share-dialog"><div class="dialog-head"><h2>共享计分台</h2><button data-close class="icon" aria-label="关闭"><i data-lucide="x"></i></button></div><div id="share-links"></div></dialog>
 <dialog id="confirm-dialog"><form id="confirm-form"><div class="dialog-head"><h2 id="confirm-title"></h2><button data-close type="button" class="icon" aria-label="关闭"><i data-lucide="x"></i></button></div><p id="confirm-copy"></p><p id="confirm-error" class="error"></p><div class="dialog-actions"><button type="button" data-close>取消</button><button type="submit" class="primary">确认</button></div></form></dialog>
 <div id="toast" role="status" hidden></div>
</body></html>
